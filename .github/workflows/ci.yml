name: Verificações

permissions:
  contents: read

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oeste_freios_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oeste_freios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      CHERP_MODE: mock
      DATABASE_URL: postgres://postgres:postgres_test_only@localhost:5432/oeste_freios_test
      JWT_SECRET: test-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: test-only-refresh-secret-at-least-32-characters
      DEV_ADMIN_EMAIL: admin@dev.local
      DEV_ADMIN_PASSWORD: Admin@123456
      LICENSE_MAX_SESSIONS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -w backend
      - run: npm run db:seed -w backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
