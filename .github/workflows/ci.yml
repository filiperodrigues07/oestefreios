name: Verificações

permissions:
  contents: read

# dev: cada push. master: cada push também — é de lá que sai o deploy, e o deploy.sh só publica
# um commit cujo CI esteja verde (ver deploy/deploy.sh, verificar_ci).
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# Um push novo na mesma branch cancela a execução anterior (que já está velha) — menos na master, onde
# cada commit precisa do seu veredito porque o deploy.sh confere o CI do commit que vai publicar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oeste_freios_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oeste_freios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      CHERP_MODE: mock
      DATABASE_URL: postgres://postgres:postgres_test_only@localhost:5432/oeste_freios_test
      JWT_SECRET: test-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: test-only-refresh-secret-at-least-32-characters
      DEV_ADMIN_EMAIL: admin@dev.local
      DEV_ADMIN_PASSWORD: Admin@123456
      LICENSE_MAX_SESSIONS: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -w backend
      - run: npm run db:seed -w backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Só dependência de produção, severidade alta+: vulnerabilidade que chega ao usuário quebra o build.
      - run: npm audit --omit=dev --audit-level=high
      # O navegador do Playwright é pesado (~150 MB): fica em cache enquanto o package-lock não mudar.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # Com o navegador em cache ainda faltam as bibliotecas do sistema.
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # Fluxo crítico da OS no navegador (backend mock + Postgres do serviço acima), ver e2e/.
      - run: npm run test:e2e
      # Relatório HTML e traces (vídeo passo a passo) só quando algo falha: sem isso o erro do E2E
      # só dá pra ler no log, sem ver a tela.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
