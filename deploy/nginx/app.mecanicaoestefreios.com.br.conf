## nginx — app.mecanicaoestefreios.com.br
## Copiar para /etc/nginx/sites-available/, criar symlink em sites-enabled, testar e recarregar.
## O certbot reescreve o bloco `server { listen 443 ... }` sozinho na primeira emissão do certificado
## (rode certbot --nginx depois de habilitar este arquivo pela primeira vez, com o site só em HTTP).

# 30 req/min por IP nas rotas de autenticação (contexto http: este arquivo é incluído lá).
limit_req_zone $binary_remote_addr zone=oeste_auth:10m rate=30r/m;

upstream oeste_freios_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.mecanicaoestefreios.com.br;

    # Necessário pro certbot validar o domínio antes de existir HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.mecanicaoestefreios.com.br;

    # Preenchido pelo certbot --nginx na primeira emissão. Se ainda não existe certificado,
    # comente as 2 linhas ssl_certificate* abaixo, suba o site em HTTP e rode o certbot depois.
    ssl_certificate     /etc/letsencrypt/live/app.mecanicaoestefreios.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mecanicaoestefreios.com.br/privkey.pem;

    server_tokens off;
    client_max_body_size 8m;

    # Cabeçalhos de segurança. Atenção: qualquer location com add_header próprio NÃO herda estes — repita-os lá.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Frontend (build estático do Vite) — ajuste o path se mudar o local de deploy.
    root /opt/oeste-freios/frontend/dist;
    index index.html;

    # Service worker e manifest da PWA nunca podem ser cacheados de forma agressiva —
    # senão o navegador demora pra pegar uma versão nova do app depois de um deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Assets com hash no nome (Vite) podem cachear pesado.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # SPA — qualquer rota que não seja arquivo real cai no index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Login e recuperação de senha: freio extra no nginx (o backend também limita por IP/e-mail).
    location /api/auth/ {
        limit_req zone=oeste_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://oeste_freios_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API + uploads servidos pelo backend Node (inclui /api/uploads/*, já tratado lá dentro).
    location /api/ {
        proxy_pass http://oeste_freios_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (não $proxy_add_x_forwarded_for): o cliente não consegue forjar o IP usado no rate limit/auditoria.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
