## nginx — app.mecanicaoestefreios.com.br
## Copiar para /etc/nginx/sites-available/, criar symlink em sites-enabled, testar e recarregar.
## O certbot reescreve o bloco `server { listen 443 ... }` sozinho na primeira emissão do certificado
## (rode certbot --nginx depois de habilitar este arquivo pela primeira vez, com o site só em HTTP).

upstream oeste_freios_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.mecanicaoestefreios.com.br;

    # Necessário pro certbot validar o domínio antes de existir HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.mecanicaoestefreios.com.br;

    # Preenchido pelo certbot --nginx na primeira emissão. Se ainda não existe certificado,
    # comente as 2 linhas ssl_certificate* abaixo, suba o site em HTTP e rode o certbot depois.
    ssl_certificate     /etc/letsencrypt/live/app.mecanicaoestefreios.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mecanicaoestefreios.com.br/privkey.pem;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Frontend (build estático do Vite) — ajuste o path se mudar o local de deploy.
    root /opt/oeste-freios/frontend/dist;
    index index.html;

    # Service worker e manifest da PWA nunca podem ser cacheados de forma agressiva —
    # senão o navegador demora pra pegar uma versão nova do app depois de um deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets com hash no nome (Vite) podem cachear pesado.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA — qualquer rota que não seja arquivo real cai no index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + uploads servidos pelo backend Node (inclui /api/uploads/*, já tratado lá dentro).
    location /api/ {
        proxy_pass http://oeste_freios_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
